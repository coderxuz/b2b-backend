[project]
name = "b2b-backend"
version = "0.1.0"
description = "B2B Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.22.0",
    "alembic>=1.13.0",
    "alembic-postgresql-enum>=1.8.0",
    "asyncpg>=0.30.0",
    "bcrypt==4.0.1",
    "fastapi>=0.115.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.35",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
generate = "alembic revision --autogenerate -m"
migrate = "alembic upgrade head"
dev = "uvicorn main:app --reload"
bot = "python -m bot.main"
test = "pytest -v"
